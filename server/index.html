<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>Voice Agent</title><script>(function(){try{var q=new URLSearchParams(location.search).get('theme');var t=(q==='light'||q==='dark')?q:((window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');document.documentElement.setAttribute('data-theme',t);if(window.matchMedia){var mq=window.matchMedia('(prefers-color-scheme: dark)');var h=function(e){if(!(new URLSearchParams(location.search).get('theme'))){document.documentElement.setAttribute('data-theme',e.matches?'dark':'light');}};if(mq.addEventListener){mq.addEventListener('change',h);}else if(mq.addListener){mq.addListener(h);}}}catch(e){}})();</script><link rel="stylesheet" href="./styles.css">
</head><body><div class="wrap"><h1 id="t-title">Voice Agent</h1><p class="sub" id="t-sub"></p><div id="banner" class="banner setup"></div><div class="card"><div class="callbox"><span class="pill" id="pill">—</span><button id="mic" disabled>●</button><button id="btn-auto" class="mini" style="display:none"></button><div class="timer" id="timer"></div></div></div><div class="card"><div class="btnrow" style="margin:0 0 10px"><strong id="t-tr">Transcript</strong></div><div id="log"><div class="empty" id="t-empty"></div></div></div><div class="card"><strong id="t-calls">Calls</strong><div style="margin-top:10px"><table><thead><tr><th id="t-when"></th><th id="t-dur"></th><th id="t-turns"></th></tr></thead><tbody id="calls"></tbody></table><div class="empty" id="t-nocalls"></div></div></div><p class="sub" id="foot"></p></div>
<script type="module" src="./app.ts"></script>
</body></html>
